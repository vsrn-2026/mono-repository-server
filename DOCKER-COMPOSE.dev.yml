version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: mono-server_backend-dev
    ports:
      - "8080:8080"
    env_file:
      - backend/.env.development
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_started
    networks:
      - mono-server-network

  redis:
    image: redis:7-alpine
    container_name: mono-server_redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - mono-server-network

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: mono-server_prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./backend/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./backend/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
    networks:
      - mono-server-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: mono-server_grafana-dev
    ports:
      - "3000:3000"
    env_file:
      - backend/.env.development
    volumes:
      - grafana-data:/var/lib/grafana
      - ./backend/grafana/provisioning:/etc/grafana/provisioning
      - ./backend/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - mono-server-network

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  mono-server-network:
    driver: bridge